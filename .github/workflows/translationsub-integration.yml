name: TranslationSub Integration — Lampac main

on:
  push:
    branches:
      - main
    paths:
      - 'Models/**'
      - 'Services/**'
      - '*.cs'
      - '*.js'
      - 'manifest.json'
      - '.github/workflows/translationsub-integration.yml'
      - 'tests/translationsub/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Models/**'
      - 'Services/**'
      - '*.cs'
      - '*.js'
      - 'manifest.json'
      - '.github/workflows/translationsub-integration.yml'
      - 'tests/translationsub/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translationsub-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Standalone TranslationSub on Lampac main
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkout current Lampac main
        uses: actions/checkout@v7.0.1
        with:
          repository: ivzaislu/lampac-nextgen
          ref: main
          path: lampac

      - name: Place TranslationSub into Lampac
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lampac/Modules/TranslationSub
          cp -a Models Services *.cs *.js manifest.json lampac/Modules/TranslationSub/
          test -f lampac/Modules/TranslationSub/Services/TimeCodeProgressService.cs
          test -f lampac/Modules/TranslationSub/manifest.json

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish Lampac
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lampac-translationsub-timecode
          dotnet publish lampac/Core/Core.csproj \
            --configuration Release \
            --output /tmp/lampac-translationsub-timecode \
            --verbosity minimal \
            -p:PlaywrightPlatform=linux-x64

          test -f /tmp/lampac-translationsub-timecode/Core.dll
          test -f /tmp/lampac-translationsub-timecode/module/TranslationSub/manifest.json
          test -f /tmp/lampac-translationsub-timecode/module/Sync/TimeCode/manifest.json

      - name: Verify TimeCode compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          file=Services/TimeCodeProgressService.cs
          grep -Fq 'DataArea.Compose' "$file"
          grep -Fq 'SELECT card, item, identity, percent, deleted FROM timecodes' "$file"
          grep -Fq 'rows.ByIdentity.TryGetValue' "$file"
          ! grep -Fq 'SELECT card, item, data FROM timecodes WHERE user = $user' "$file"

      - name: Start deterministic TMDB and Online mocks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/translationsub/mock_http.py > /tmp/translationsub-mock.log 2>&1 &
          echo $! > /tmp/translationsub-mock.pid
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 1 http://127.0.0.1:9130/__stats > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" = 1

      - name: Start Lampac with TranslationSub and TimeCode
        shell: bash
        run: |
          set -euo pipefail
          # Lampac treats loopback absolute URLs as its own /lite route.
          # Use the runner interface IP for separate mock-balancer origins.
          mock_ip="$(hostname -I | awk '{print $1}')"
          test -n "$mock_ip"
          export NO_PROXY="${NO_PROXY:-},$mock_ip"
          cat > /tmp/lampac-translationsub-timecode/init.yaml <<YAML
          chromium:
            enable: false
          firefox:
            enable: false
          rch:
            enable: false
          cache:
            type: mem
          accsdb:
            enable: false
          BaseModule:
            LoadModules:
              - TimeCode
              - TranslationSub
              - Collaps
              - HDVB
          listen:
            port: 9118
          YAML

          # ModuleInvoke.Init reads module-specific settings from init.conf.
          # Keep the global Lampac runtime configuration in init.yaml.
          cat > /tmp/lampac-translationsub-timecode/init.conf <<JSON
          {
            "TranslationSub": {
              "enable": true,
              "tmdb_apihost": "http://127.0.0.1:9130/tmdb",
              "tmdb_apikey": "smoke-test-key"
            },
            "Collaps": {
              "enable": true,
              "overridehost": "http://${mock_ip}:9130/balancer/one"
            },
            "HDVB": {
              "enable": false,
              "overridehost": "http://${mock_ip}:9130/balancer/two"
            }
          }
          JSON

          (cd /tmp/lampac-translationsub-timecode && exec dotnet Core.dll > /tmp/lampac-translationsub-timecode.log 2>&1) &
          echo $! > /tmp/lampac-translationsub-timecode.pid

          ready=0
          for _ in $(seq 1 180); do
            if curl -fsS --max-time 2 'http://127.0.0.1:9118/translationsub.js' >/tmp/translationsub.js 2>/dev/null \
              && curl -fsS --max-time 2 'http://127.0.0.1:9118/translationsub/v2/settings?uid=timecode-smoke' >/tmp/translationsub-settings.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/lampac-translationsub-timecode.pid)" 2>/dev/null; then
              tail -n 500 /tmp/lampac-translationsub-timecode.log || true
              exit 1
            fi
            sleep 0.5
          done

          test "$ready" = 1
          node --check /tmp/translationsub.js
          for js in /tmp/lampac-translationsub-timecode/module/TranslationSub/*.js; do
            node --check "$js"
          done
          grep -Fq '"success":true' /tmp/translationsub-settings.json

      - name: Verify settings persistence and API error handling
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 -X POST \
            'http://127.0.0.1:9118/translationsub/v2/settings?uid=timecode-smoke' \
            -H 'Content-Type: application/json' \
            --data '{"uid":"timecode-smoke","checkIntervalHours":3,"sources":[],"useTmdbSchedule":false}' \
            -o /tmp/translationsub-settings-write.json

          curl -fsS --max-time 10 \
            'http://127.0.0.1:9118/translationsub/v2/settings?uid=timecode-smoke' \
            -o /tmp/translationsub-settings-read.json

          curl -fsS --max-time 10 -X POST \
            'http://127.0.0.1:9118/translationsub/v2/subscriptions?uid=timecode-smoke' \
            -o /tmp/translationsub-empty-command.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ('write', 'read'):
              response = json.loads(Path(f'/tmp/translationsub-settings-{name}.json').read_text())
              assert response.get('success') is True, response
              settings = response.get('settings') or {}
              assert settings.get('CheckIntervalHours') == 3, settings
              assert settings.get('UseTmdbSchedule') is False, settings

          error = json.loads(Path('/tmp/translationsub-empty-command.json').read_text())
          assert error.get('success') is False and error.get('error') == 'empty_body', error
          print('TranslationSub settings persisted, empty command handled safely')
          PY

      - name: Verify typed TimeCode progress reaches TranslationSub snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from datetime import datetime, timezone

          root = '/tmp/lampac-translationsub-timecode/database'
          uid = 'timecode-smoke'
          profile = '7'
          area = uid + ':' + profile
          sub_id = 'timecode-main-schema-smoke'

          with sqlite3.connect(root + '/TimeCode.sql', timeout=10) as db:
              db.execute('DELETE FROM timecodes WHERE user = ?', (area,))
              db.execute(
                  '''
                  INSERT INTO timecodes
                      (user, identity, card, item, position, duration, percent, profile,
                       deleted, watched_at, updated_at, extra)
                  VALUES (?, ?, ?, NULL, 0, 0, 85, 0, 0, 1, 1, NULL)
                  ''',
                  (area, 'tv-123-s1e3', '123_tv'),
              )
              db.commit()

          with sqlite3.connect(root + '/translationsub.db', timeout=10) as db:
              db.execute('DELETE FROM profile_progress WHERE uid = ?', (uid,))
              db.execute('DELETE FROM subscriptions WHERE uid = ?', (uid,))
              db.execute(
                  '''
                  INSERT INTO subscriptions
                      (id, uid, content_id, title, original_title, tmdb_id, is_serial,
                       current_season, last_season, last_episode, sources_json, created_at,
                       tmdb_new_season_available)
                  VALUES (?, ?, ?, ?, ?, ?, 1, 1, 1, 5, '[]', ?, 0)
                  ''',
                  (
                      sub_id, uid, '123', 'TimeCode Smoke', 'TimeCode Smoke', '123',
                      datetime.now(timezone.utc).isoformat(),
                  ),
              )
              db.commit()
          PY

          curl -fsS --max-time 10 \
            'http://127.0.0.1:9118/translationsub/v2/snapshot?uid=timecode-smoke&profile_id=7' \
            -o /tmp/translationsub-snapshot.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('/tmp/translationsub-snapshot.json').read_text())
          rows = snapshot.get('subscriptions') or []
          sub = next((row for row in rows if row.get('id') == 'timecode-main-schema-smoke'), None)
          assert sub is not None, snapshot
          assert sub.get('watchedEpisode') == 3, sub
          print('TranslationSub typed TimeCode sync passed; watchedEpisode=3')
          PY

      - name: Verify NWS profile isolation, fanout and reconnect
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/translationsub/nws_integration.py

      - name: Verify TMDB scheduling, voice aggregation and balancer fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/translationsub/external_integration.py

      - name: Verify terminal-series auto-unsubscribe and TimeCode preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/translationsub/terminal_cleanup.py

      - name: Diagnostic tail
        if: failure()
        shell: bash
        run: |
          tail -n 500 /tmp/lampac-translationsub-timecode.log 2>/dev/null || true
          tail -n 100 /tmp/translationsub-mock.log 2>/dev/null || true

      - name: Stop Lampac
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/lampac-translationsub-timecode.pid ] && kill "$(cat /tmp/lampac-translationsub-timecode.pid)" 2>/dev/null || true
          [ -f /tmp/translationsub-mock.pid ] && kill "$(cat /tmp/translationsub-mock.pid)" 2>/dev/null || true
